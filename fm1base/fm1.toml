# M1 on fm1-base (tools/build.py in an fm1-base checkout with data_lo, like fm1-d50). Build:
#   python3 tools/build.py ../fm1-m1/fm1base --no-ble          (in fm1-base, beside this repository)
name = "M1"
id_prefix = "FM-1_61"
usb_manufacturer = "fm1-m1"
usb_product = "M1 FM-1"
# the app in [0x4000, 0x34000) (192 KB: the image is ~148 KB), the data area from 0x34000, as large as possible for samples. The sound bank (FM1B) is in the resource region
# 0x34000 .. 0xDE000, 696 320 B (app.h APP_RES_BASE), the panel's calibration in 0xDE000..0xDFFFF, the settings in 0xFC000
data_lo = 0x34000
# the user's own bank (never Korg's data in the repo or in a published build): optional at build time
resources = "../roms/out/m1.fm1b"
resources_what = "M1 data"
resources_var = true
resources_magic = "FM1B"
backup = true
emu = ["data"]
words = "words.tsv"
ble = false
cpu2 = false
o2 = ["m1_unit.c", "m1_fx.c", "m1_fx2.c", "m1_combi.c", "../engine/sf2fx.c", "../engine/sf2out.c", "../engine/live_cache/sound_cache.c", "../engine/live_cache/mp3_sound.c"]
o2_cflags = ["-DFM1_BASE=1"]
o2_include = ["m1_cfg.h"]
include = ["../engine", "../engine/live_cache", "../engine/third_party/mp3"]
device_include = ["inc"]
vendored = ["../engine/"]
tagline = "a Korg M1-style synth on the FM-1"
repo = "https://github.com/mwedmark/fm1-m1"
licence = "GPL-3.0-only"
author = "mwedmark"
description = "A Korg M1 on the FM-1, played from your own ROM dump: fm1-sf2's sample engine on fm1-base, with the M1's factory programs, drum kits and effects."
tags = ["synth"]
install = "https://mwedmark.github.io/fm1-m1/install/"
screenshot = "docs/img/screen.png"
